<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title description">
  <title id="title">Agent Coordinator terminal dashboard</title>
  <desc id="description">A real dashboard showing coordinated repositories, coding-agent runtimes, skills, and delivery routes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131b"/>
      <stop offset="1" stop-color="#181322"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="530" rx="32" fill="#0b0c12"/>
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="1216" height="466" rx="20" fill="url(#background)" stroke="#3b334a"/>
    <path d="M32 86h1216" stroke="#302b3b"/>
    <circle cx="68" cy="59" r="7" fill="#ff5f57"/>
    <circle cx="92" cy="59" r="7" fill="#febc2e"/>
    <circle cx="116" cy="59" r="7" fill="#28c840"/>
    <text x="640" y="65" text-anchor="middle" fill="#8b91a7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">agent-coordinator — zsh</text>
  </g>
  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="17">
    <text x="80" y="112" fill="#67e8f9" xml:space="preserve">$ coordinator</text>
    <text x="80" y="139" fill="#c084fc" xml:space="preserve">╭ Agent Coordinator · market-intel ───────────────────────────────────v0.4.0 ╮</text>
    <text x="80" y="166" fill="#d8dee9" xml:space="preserve">│ branch  feature/MIQ-8-sentry-feedback                                      │</text>
    <text x="80" y="193" fill="#64748b" xml:space="preserve">├─ Repositories ─────────────────────────────────────────────────────────────┤</text>
    <text x="80" y="220" fill="#d8dee9" xml:space="preserve">│ ● backend      mirror        feature/MIQ-8-sentry-feedb… clean             │</text>
    <text x="80" y="247" fill="#d8dee9" xml:space="preserve">│ ● frontend     mirror        feature/MIQ-8-sentry-feedb… clean             │</text>
    <text x="80" y="274" fill="#d8dee9" xml:space="preserve">│ ● infra        fixed:main    main                        read-only         │</text>
    <text x="80" y="301" fill="#64748b" xml:space="preserve">├─ Agent tooling ────────────────────────────────────────────────────────────┤</text>
    <text x="80" y="328" fill="#d8dee9" xml:space="preserve">│ ● Codex  Claude  Cursor  OpenCode   29 skill links                         │</text>
    <text x="80" y="355" fill="#64748b" xml:space="preserve">├─ Delivery ─────────────────────────────────────────────────────────────────┤</text>
    <text x="80" y="382" fill="#d8dee9" xml:space="preserve">│ ● Git runtime ready   2 environments   4 component routes                  │</text>
    <text x="80" y="409" fill="#64748b" xml:space="preserve">├─ Actions ──────────────────────────────────────────────────────────────────┤</text>
    <text x="80" y="436" fill="#d8dee9" xml:space="preserve">│ [s] synchronize   [d] doctor   [q] exit                                    │</text>
    <text x="80" y="463" fill="#c084fc" xml:space="preserve">╰────────────────────────────────────────────────────────────────────────────╯</text>
  </g>
</svg>
